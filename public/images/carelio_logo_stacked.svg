  <!-- Typography: Centered CarelioEMR Wordmark -->
  <text x="160" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.8px">
    <tspan fill="#0B2D5B">Carelio</tspan><tspan fill="#0078F0">EMR</tspan>
  </text>

  <!-- Typography: Centered Tagline -->
  <text x="160" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#0B2D5B" letter-spacing="3px">
    CONNECTED DATA. BETTER CARE.
  </text>
</svg>
