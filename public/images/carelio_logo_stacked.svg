<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" fill="none">
  <defs>
    <linearGradient id="carelioCrescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ACD7" />
      <stop offset="35%" stop-color="#009FF0" />
      <stop offset="70%" stop-color="#0078F0" />
      <stop offset="100%" stop-color="#0046A8" />
    </linearGradient>
    <linearGradient id="carelioBarTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ACDF" />
      <stop offset="100%" stop-color="#009FF0" />
    </linearGradient>
    <linearGradient id="carelioBarBotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008DDC" />
      <stop offset="100%" stop-color="#0046A8" />
    </linearGradient>
  </defs>

  <!-- Centered Emblem Mark (150x150 scaled from 100x100) -->
  <g transform="translate(85, 12) scale(1.5)">
