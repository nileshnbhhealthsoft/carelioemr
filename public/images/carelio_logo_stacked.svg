    <path d="M 50,3 C 76,3 97,24 97,50 C 97,76 76,97 50,97 C 42,97 34.5,94.8 28,90.8 L 34.2,80.5 C 39,83.2 44.3,84.8 50,84.8 C 69.2,84.8 84.8,69.2 84.8,50 C 84.8,30.8 69.2,15.2 50,15.2 C 44.3,15.2 39,16.8 34.2,19.5 L 28,9.2 C 34.5,5.2 42,3 50,3 Z" fill="url(#carelioCrescentGrad)" />

    <!-- Upper Data Stream Nodes & Bars -->
    <circle cx="28" cy="11" r="3.8" fill="#00ACDF" />
    <rect x="28" y="8.8" width="22" height="4.4" rx="2.2" fill="url(#carelioBarTopGrad)" />

    <circle cx="18" cy="21.5" r="3.8" fill="#00ACDF" />
    <rect x="18" y="19.3" width="28" height="4.4" rx="2.2" fill="url(#carelioBarTopGrad)" />

    <circle cx="12" cy="32" r="3.8" fill="#00ACDF" />
    <rect x="12" y="29.8" width="31" height="4.4" rx="2.2" fill="url(#carelioBarTopGrad)" />

    <circle cx="16" cy="42" r="3.8" fill="#00ACDF" />
    <rect x="16" y="39.8" width="24" height="4.4" rx="2.2" fill="url(#carelioBarTopGrad)" />

    <!-- Lower Data Stream Nodes & Bars -->
    <circle cx="16" cy="58" r="3.8" fill="#008DDC" />
    <rect x="16" y="55.8" width="24" height="4.4" rx="2.2" fill="url(#carelioBarBotGrad)" />

    <circle cx="12" cy="68" r="3.8" fill="#008DDC" />
    <rect x="12" y="65.8" width="31" height="4.4" rx="2.2" fill="url(#carelioBarBotGrad)" />

    <circle cx="18" cy="78.5" r="3.8" fill="#0046A8" />
    <rect x="18" y="76.3" width="28" height="4.4" rx="2.2" fill="url(#carelioBarBotGrad)" />

    <circle cx="28" cy="89" r="3.8" fill="#0046A8" />
    <rect x="28" y="86.8" width="22" height="4.4" rx="2.2" fill="url(#carelioBarBotGrad)" />
